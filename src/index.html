<!DOCTYPE html>
<html lang="ru" class="noblur">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VoidLauncher</title>
<script src="i18n.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Pixelify+Sans:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" media="print" onload="this.media='all'"><noscript><link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;600&family=Pixelify+Sans:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"></noscript>
<style>
@property --bg1{syntax:'<color>';inherits:true;initial-value:#0b1410}@property --bg2{syntax:'<color>';inherits:true;initial-value:#10201a}@property --acc{syntax:'<color>';inherits:true;initial-value:#4ade80}@property --acc2{syntax:'<color>';inherits:true;initial-value:#22d3ee}
:root{transition:--bg1 1s ease,--bg2 1s ease,--acc 1s ease,--acc2 1s ease;--bg1:#0b1410;--bg2:#10201a;--panel:rgba(18,32,26,.62);--line:rgba(255,255,255,.09);--text:#e8f3ec;--mute:#8fa89b;--acc:#4ade80;--acc2:#22d3ee;--accrgb:74,222,128;--off:rgba(255,255,255,.12);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-mode="light"]{--bg1:#e9f4ee;--bg2:#d3e8dd;--panel:rgba(255,255,255,.66);--line:rgba(0,0,0,.09);--text:#13271d;--mute:#5b7266;--off:rgba(0,0,0,.14)}
:root[data-theme="amethyst"]{--acc:#c084fc;--acc2:#f472b6;--accrgb:192,132,252}
:root[data-theme="ember"]{--acc:#fb923c;--acc2:#f43f5e;--accrgb:251,146,60}
:root[data-theme="frost"]{--acc:#38bdf8;--acc2:#818cf8;--accrgb:56,189,248}
:root[data-theme="amethyst"][data-mode="dark"]{--bg1:#120d1c;--bg2:#1e1430}
:root[data-theme="ember"][data-mode="dark"]{--bg1:#1a0f0b;--bg2:#2b1710}
:root[data-theme="frost"][data-mode="dark"]{--bg1:#0a1220;--bg2:#101d34}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font:14px/1.45 Inter,system-ui,sans-serif;color:var(--text);background:linear-gradient(160deg in oklab,var(--bg1),var(--bg2));overflow:hidden;transition:background .6s,color .4s}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.blob{position:fixed;border-radius:50%;filter:blur(90px);opacity:.28;z-index:0;transition:background .6s;animation:drift 22s ease-in-out infinite alternate}
.b1{width:46vmax;height:46vmax;background:var(--acc);left:-12vmax;top:-14vmax}
.b2{width:40vmax;height:40vmax;background:var(--acc2);right:-10vmax;bottom:-12vmax;animation-duration:28s;animation-delay:-8s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.app{position:relative;z-index:1;height:100%;display:grid;place-items:center;padding:14px}
.win{width:min(940px,100%);height:min(430px,100%);display:grid;grid-template-columns:168px 1fr;grid-template-rows:auto 1fr;background:var(--panel);backdrop-filter:blur(22px) saturate(1.3);-webkit-backdrop-filter:blur(22px) saturate(1.3);border:1px solid var(--line);border-radius:18px;box-shadow:0 30px 80px rgba(0,0,0,.35),0 0 0 1px rgba(var(--accrgb),.08);overflow:hidden;animation:open 1.1s cubic-bezier(.22,1,.36,1)}
@keyframes open{from{opacity:0;transform:translateY(30px) scale(.94);filter:blur(10px)}}
header{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:14px 18px;border-bottom:1px solid var(--line)}
.logo{width:28px;height:28px;border-radius:7px;background:linear-gradient(135deg in oklab,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(var(--accrgb),.55);image-rendering:pixelated;animation:pulse 3s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 28px rgba(var(--accrgb),.9)}}
h1{font:600 19px "Pixelify Sans",system-ui,sans-serif;letter-spacing:.02em}
.sp{flex:1}
.mode{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--text);cursor:pointer;font-size:16px;transition:transform .5s cubic-bezier(.22,1,.36,1),background .4s,opacity .4s}
.mode:hover{background:rgba(var(--accrgb),.15);transform:rotate(25deg)}
nav{position:relative;display:flex;flex-direction:column;gap:4px;padding:12px;border-right:1px solid var(--line);overflow-y:auto;scrollbar-width:none}
nav button{position:relative;z-index:1;flex:none;text-align:left;padding:11px 14px;border:0;background:none;color:var(--mute);font:500 14px Inter,sans-serif;cursor:pointer;border-radius:9px;transition:color .25s}
nav button:hover,nav button.on{color:var(--text)}
#ind{position:absolute;z-index:0;left:12px;right:12px;border-radius:9px;background:rgba(var(--accrgb),.16);box-shadow:inset 0 0 0 1px rgba(var(--accrgb),.4);transition:top .6s cubic-bezier(.34,1.35,.64,1),height .6s cubic-bezier(.34,1.35,.64,1)}
main{min-height:0;overflow-y:auto;padding:16px;position:relative}
.tab{display:none;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;align-content:start}
.tab.on{display:grid}.tab.on>.card{animation:up .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*70ms)}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.96);filter:blur(7px)}}
.card{padding:14px;border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.035);transition:border-color .5s,transform .6s cubic-bezier(.22,1,.36,1),background .5s,box-shadow .5s}
.card.pop{animation:pop .9s cubic-bezier(.22,1,.36,1)}@keyframes pop{0%{box-shadow:0 0 0 0 rgba(var(--accrgb),.5)}100%{box-shadow:0 0 0 18px rgba(var(--accrgb),0)}}
.card:hover{border-color:rgba(var(--accrgb),.45);transform:translateY(-3px);background:rgba(var(--accrgb),.06)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.t{font-weight:600}.d{color:var(--mute);font-size:12.5px;margin-top:2px}
.sw{position:relative;flex:none;width:40px;height:22px;border-radius:99px;background:var(--off);cursor:pointer;overflow:hidden;transition:background .5s,box-shadow .5s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .55s cubic-bezier(.34,1.56,.64,1),width .25s}.sw:active::after{width:24px}
.sw.on{background:linear-gradient(90deg in oklab,var(--acc),var(--acc2));box-shadow:0 0 14px rgba(var(--accrgb),.5)}
.sw.on::after{transform:translateX(16px)}.sw.on:active::after{transform:translateX(10px)}
.rng{margin-top:12px;display:flex;align-items:center;gap:10px}
input[type=range]{flex:1;appearance:none;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--acc) var(--v,50%),var(--off) var(--v,50%));outline:0;cursor:pointer}
input[type=range]::-webkit-slider-thumb{appearance:none;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(var(--accrgb),.45);transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s}input[type=range]:active::-webkit-slider-thumb{transform:scale(1.45);box-shadow:0 0 0 7px rgba(var(--accrgb),.3)}
input[type=range]::-webkit-slider-thumb:hover{transform:scale(1.2)}
input[type=range]::-moz-range-thumb{width:16px;height:16px;border:0;border-radius:50%;background:#fff}
.val{min-width:34px;text-align:right;color:var(--mute);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:6px;margin-top:12px;flex-wrap:wrap}
.chip{padding:5px 11px;border-radius:8px;border:1px solid var(--line);color:var(--mute);cursor:pointer;font-size:12.5px;transition:color .4s,border-color .5s,background .5s,transform .4s;position:relative;overflow:hidden}.chip:active{transform:scale(.93)}
.chip:hover{color:var(--text)}
.chip.on{color:var(--text);border-color:rgba(var(--accrgb),.6);background:rgba(var(--accrgb),.16)}
.key{padding:4px 10px;border-radius:7px;border:1px solid var(--line);font:500 12px "Pixelify Sans",monospace;color:var(--mute)}
.themes{display:flex;gap:10px;margin-top:12px}
.th{width:34px;height:34px;border-radius:10px;border:2px solid transparent;cursor:pointer;transition:transform .5s cubic-bezier(.34,1.56,.64,1),border-color .4s;box-shadow:0 0 0 1px var(--line)}
.th:hover{transform:translateY(-3px) rotate(-4deg)}
.th.on{border-color:var(--text);transform:scale(1.08)}
.rp{position:absolute;border-radius:50%;background:rgba(var(--accrgb),.45);transform:scale(0);animation:rp .8s cubic-bezier(.22,1,.36,1) forwards;pointer-events:none}@keyframes rp{to{transform:scale(1);opacity:0}}
.wave{position:fixed;z-index:5;width:20px;height:20px;margin:-10px;border-radius:50%;background:var(--acc);opacity:.35;pointer-events:none;animation:wv 1.4s cubic-bezier(.22,1,.36,1) forwards}@keyframes wv{to{transform:scale(220);opacity:0}}
nav button,.mode{position:relative;overflow:hidden}.mode.off{opacity:.45}.mode.hint{animation:hint 1.6s ease-in-out infinite}@keyframes hint{50%{box-shadow:0 0 0 7px rgba(var(--accrgb),.25)}}
.wide{grid-column:1/-1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(orientation:portrait){html,body{overflow:hidden}.app{position:fixed;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;transform:translateX(100vw) rotate(90deg);padding:10px}}

header{-webkit-app-region:drag}header button{-webkit-app-region:no-drag}
.win{height:min(470px,100%)}
.btn{border:0;border-radius:11px;padding:11px 22px;font:600 14px Inter,sans-serif;color:#06130c;cursor:pointer;background:linear-gradient(90deg in oklab,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(var(--accrgb),.4);transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .4s,opacity .3s;position:relative;overflow:hidden}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 28px rgba(var(--accrgb),.7)}.btn:active{transform:scale(.95)}.btn.g{background:transparent;color:var(--text);border:1px solid var(--line);box-shadow:none;padding:6px 12px;font-size:12.5px}.btn:disabled{opacity:.5;pointer-events:none}
select,.in{width:100%;margin-top:10px;padding:9px 11px;border-radius:9px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--text);font:500 13.5px Inter,sans-serif;outline:0;transition:border-color .4s}select:focus,.in:focus{border-color:rgba(var(--accrgb),.6)}select option{background:#16241d;color:#e8f3ec}
.av{width:38px;height:38px;flex:none;border-radius:9px;display:grid;place-items:center;font:600 17px "Pixelify Sans",sans-serif;color:#06130c;background:linear-gradient(135deg in oklab,var(--acc),var(--acc2));text-transform:uppercase}
.who{display:flex;align-items:center;gap:12px;min-width:0}.who .t{overflow:hidden;text-overflow:ellipsis}
.acc{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:12px;cursor:pointer;transition:border-color .5s,background .5s,transform .5s cubic-bezier(.22,1,.36,1);animation:up .7s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*60ms)}
.acc:hover{transform:translateX(4px);border-color:rgba(var(--accrgb),.4)}.acc.on{border-color:rgba(var(--accrgb),.7);background:rgba(var(--accrgb),.12)}
.bar{height:6px;margin-top:12px;border-radius:9px;background:var(--off);overflow:hidden}.bar i{display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg in oklab,var(--acc),var(--acc2));transition:width .5s cubic-bezier(.22,1,.36,1)}
.log{margin-top:8px;color:var(--mute);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.toast{position:fixed;left:50%;bottom:22px;z-index:9;transform:translate(-50%,30px);opacity:0;padding:10px 18px;border-radius:12px;background:var(--panel);border:1px solid rgba(var(--accrgb),.5);backdrop-filter:blur(16px);transition:.6s cubic-bezier(.22,1,.36,1);pointer-events:none}.toast.show{transform:translate(-50%,0);opacity:1}

.themes{flex-wrap:wrap;gap:9px}.th{width:30px;height:30px;border-radius:9px}
.win{position:relative}@property --ang{syntax:'<angle>';inherits:false;initial-value:0deg}@keyframes spin{to{--ang:360deg}}
.win::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1px;background:conic-gradient(from var(--ang),transparent 0 72%,rgba(var(--accrgb),.75) 86%,transparent);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:spin 9s linear infinite;pointer-events:none;z-index:3}
.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.065),rgba(255,255,255,.02))}.card>*{position:relative}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),rgba(var(--accrgb),.17),transparent 70%);opacity:0;transition:opacity .5s;pointer-events:none}.card:hover::before{opacity:1}
h1{background:linear-gradient(90deg,var(--text) 40%,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
main::-webkit-scrollbar{width:8px}main::-webkit-scrollbar-thumb{background:rgba(var(--accrgb),.3);border-radius:9px}
.btn:not(.g)::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:skewX(-20deg);animation:shine 3.8s ease-in-out infinite}@keyframes shine{55%,100%{left:140%}}
#go{padding:14px 34px;font-size:15px;border-radius:13px}#cav{width:48px;height:48px;font-size:22px;box-shadow:0 0 0 3px rgba(var(--accrgb),.25),0 0 22px rgba(var(--accrgb),.5)}
nav button{padding:11px 14px;transition:color .25s,transform .4s cubic-bezier(.22,1,.36,1)}nav button:hover{transform:translateX(3px)}
.noblur .win{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2)}
#tname{color:var(--acc);font-weight:600}

/* ---- главный экран и анимации меню ---- */
#fx{z-index:2;pointer-events:none}
h1{font:600 16px Unbounded,"Pixelify Sans",system-ui,sans-serif;letter-spacing:.04em;cursor:pointer}.logo{cursor:pointer;transition:transform .6s cubic-bezier(.34,1.56,.64,1)}.logo:hover{transform:rotate(90deg) scale(1.1)}
.win{opacity:0;animation:none}
body.go .win{opacity:1;animation:open 1.1s cubic-bezier(.22,1,.36,1) both}
body:not(.go) .win{visibility:hidden;transition:opacity .4s,visibility 0s .4s}
@keyframes navin{from{opacity:0;transform:translateX(-26px);filter:blur(6px)}}
@keyframes drop{from{opacity:0;transform:translateY(-16px);filter:blur(6px)}}
body.go nav button{animation:navin .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--n,0)*80ms + .35s)}
body.go header h1,body.go header .mode:not(.hint){animation:drop .8s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--n,0)*70ms + .25s)}
body.go #ind{animation:navin .8s cubic-bezier(.22,1,.36,1) backwards .3s}
#splash{position:fixed;inset:0;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;transition:opacity .8s,transform .9s cubic-bezier(.22,1,.36,1),filter .8s}
#splash::before{content:"";position:absolute;width:60vmin;height:60vmin;border-radius:50%;background:radial-gradient(circle,rgba(var(--accrgb),.28),transparent 68%);filter:blur(30px);animation:glow 5s ease-in-out infinite alternate;z-index:-1}
@keyframes glow{to{transform:scale(1.35);opacity:.6}}
body.go #splash{opacity:0;transform:scale(1.15);filter:blur(16px);pointer-events:none}
.sbar{position:absolute;top:0;left:0;right:0;display:flex;justify-content:flex-end;gap:6px;padding:14px 18px;-webkit-app-region:drag}.sbar button{-webkit-app-region:no-drag}
#stitle{font:600 clamp(30px,7vw,84px)/1.1 Unbounded,"Pixelify Sans",system-ui,sans-serif;letter-spacing:.01em;display:flex;user-select:none}
#stitle i{font-style:normal;display:inline-block;color:color-mix(in srgb,var(--acc),var(--acc2) calc(var(--k)*9.09%));text-shadow:0 0 16px rgba(var(--accrgb),.35);animation:rise 1.1s cubic-bezier(.22,1,.36,1) backwards,bob 4.5s ease-in-out infinite;animation-delay:calc(var(--k)*75ms + .2s),calc(var(--k)*160ms + 1.8s)}
@keyframes rise{from{opacity:0;transform:translateY(50px) scale(.7);filter:blur(14px)}}@keyframes bob{50%{transform:translateY(-7px)}}
#ssub{margin-top:14px;color:var(--mute);letter-spacing:.32em;text-transform:uppercase;font-size:12px;animation:drop 1s cubic-bezier(.22,1,.36,1) backwards 1.1s}
#sline{height:2px;width:0;margin:22px auto 0;border-radius:9px;background:linear-gradient(90deg,transparent,var(--acc),var(--acc2),transparent);animation:line 1.4s cubic-bezier(.22,1,.36,1) forwards .9s}@keyframes line{to{width:min(360px,60vw)}}
#start{margin-top:44px;border:0;outline:0;background:rgba(var(--accrgb),.14);color:var(--text);font:500 15px Inter,sans-serif;letter-spacing:.2em;text-transform:uppercase;padding:16px 48px;border-radius:999px;cursor:pointer;transition:background .5s,box-shadow .5s,transform .5s cubic-bezier(.34,1.56,.64,1),letter-spacing .5s;animation:drop 1s cubic-bezier(.22,1,.36,1) backwards 1.4s}
#start span{display:inline-block;margin-left:8px;transition:transform .5s cubic-bezier(.34,1.56,.64,1)}
#start:hover{background:rgba(var(--accrgb),.3);box-shadow:0 0 44px rgba(var(--accrgb),.5);transform:translateY(-3px);letter-spacing:.26em}#start:hover span{transform:translateX(8px)}#start:active{transform:scale(.95)}

/* ---- горизонтальное меню ---- */
.win{grid-template-columns:1fr;grid-template-rows:auto auto 1fr}
nav{flex-direction:row;gap:6px;padding:10px 14px;border-right:0;border-bottom:1px solid var(--line);overflow:hidden}
nav button{flex:1;text-align:center;padding:11px 10px;white-space:nowrap}
nav button:hover{transform:translateY(-2px)}
#ind{left:0;right:auto;top:10px;bottom:10px;height:auto;transition:left .6s cubic-bezier(.34,1.35,.64,1),width .6s cubic-bezier(.34,1.35,.64,1)}
@keyframes navin{from{opacity:0;transform:translateY(-16px);filter:blur(6px)}}
.win header .mode{-webkit-app-region:no-drag}

/* ---- главный экран в портретной ориентации поворачивается набок ---- */
@media(orientation:portrait){
#splash{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;translate:100vw 0;rotate:90deg}
body.go #splash{transform:none}
#stitle{font-size:clamp(30px,7vh,84px)}
#sline{animation-name:line2}@keyframes line2{to{width:min(360px,40vh)}}
}

.logo{background:none!important;box-shadow:none!important;overflow:visible}.logo svg{width:100%;height:100%;display:block;filter:drop-shadow(0 0 8px rgba(var(--accrgb),.55))}
#slogo{width:clamp(70px,16vh,120px);margin-bottom:18px;animation:rise 1.2s cubic-bezier(.22,1,.36,1) backwards,bob 5s ease-in-out infinite 1.4s;filter:drop-shadow(0 0 26px rgba(var(--accrgb),.6))}#slogo svg{width:100%;display:block}

/* ---- окно «О лаунчере» ---- */
#about{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:0;pointer-events:none;transition:opacity .45s}
#about.on{opacity:1;pointer-events:auto}
#about .box{width:min(420px,88%);padding:26px;border-radius:20px;text-align:center;background:var(--panel);border:1px solid rgba(var(--accrgb),.35);box-shadow:0 0 60px rgba(var(--accrgb),.25);transform:translateY(24px) scale(.94);filter:blur(6px);transition:transform .6s cubic-bezier(.34,1.4,.64,1),filter .5s}
#about.on .box{transform:none;filter:none}
#about .lg{width:72px;margin:0 auto 10px}#about .lg svg{width:100%;display:block;filter:drop-shadow(0 0 16px rgba(var(--accrgb),.6))}
#about h2{margin:0;font:600 20px Unbounded,"Pixelify Sans",system-ui,sans-serif}#about .ver{color:var(--mute);font-size:13px;margin-top:4px}
#about .rowi{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line);font-size:14px;text-align:left}#about .rowi span{color:var(--mute)}
@media(orientation:portrait){#about{inset:auto;top:0;left:0;width:100vh;height:100vw;transform-origin:top left;translate:100vw 0;rotate:90deg}}

.mod{display:flex;align-items:center;gap:12px;padding:10px;margin-top:8px;border:1px solid var(--line);border-radius:12px;animation:up .6s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*35ms);transition:border-color .4s,transform .4s cubic-bezier(.22,1,.36,1)}.mod:hover{border-color:rgba(var(--accrgb),.4);transform:translateX(3px)}
.mod img{width:42px;height:42px;border-radius:10px;object-fit:cover;background:var(--off);flex:none}.mod .mi{flex:1;min-width:0}.mod .mi .t,.mod .mi .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mod .dl{color:var(--mute);font-size:12px;white-space:nowrap}

/* ===== PERF 1.5.1: облегчённые эффекты ===== */
/* фоновые «пятна»: градиент вместо filter:blur(90px) */
.blob{filter:none!important;background:radial-gradient(circle,var(--acc) 0,transparent 68%)!important;opacity:.2;transition:none;will-change:transform}
.b2{background:radial-gradient(circle,var(--acc2) 0,transparent 68%)!important}
/* анимации без filter:blur (он перерисовывается каждый кадр) */
@keyframes open{from{opacity:0;transform:translateY(30px) scale(.94)}}
@keyframes up{from{opacity:0;transform:translateY(22px) scale(.96)}}
@keyframes navin{from{opacity:0;transform:translateY(-16px)}}
@keyframes drop{from{opacity:0;transform:translateY(-16px)}}
@keyframes rise{from{opacity:0;transform:translateY(50px) scale(.7)}}
body.go .win{animation-duration:.6s}
.tab.on>.card{animation-duration:.45s;animation-delay:calc(var(--i,0)*40ms)}
/* бесконечные перерисовки: убраны */
.win::before{display:none}
.logo{animation:none!important}
.mode.hint{animation:hint 1.6s ease-in-out infinite}
@keyframes hint{50%{transform:scale(1.12)}}
.btn:not(.g)::after{display:none}
#go::after{display:block;left:0;transform:translateX(-150%) skewX(-20deg);animation:shine2 3.8s ease-in-out infinite;will-change:transform}
@keyframes shine2{55%,100%{transform:translateX(350%) skewX(-20deg)}}
/* стартовый экран: после входа всё замирает и скрывается */
body.go #splash{filter:none;visibility:hidden;transition:opacity .5s,transform .6s cubic-bezier(.22,1,.36,1),visibility 0s .6s}
body.go #splash *,body.go #splash::before{animation-play-state:paused!important}
#splash::before{filter:none}
#slogo{filter:drop-shadow(0 0 12px rgba(var(--accrgb),.5))}
/* панель-«стекло» по умолчанию без backdrop-filter, включается переключателем */
html:not(.noblur) .win{backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.toast{backdrop-filter:none;-webkit-backdrop-filter:none;background:var(--bg2);visibility:hidden;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .4s,visibility 0s .4s}
.toast.show{visibility:visible;transition:transform .4s cubic-bezier(.22,1,.36,1),opacity .4s}
#about{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(0,0,0,.6);visibility:hidden;transition:opacity .35s,visibility 0s .35s}
#about.on{visibility:visible;transition:opacity .35s}
#about .box{filter:none}
/* прогресс-бар через transform (без пересчёта layout) */
.bar i{width:100%!important;transform-origin:left center;transform:scaleX(var(--p,0));transition:transform .3s ease-out}
/* волна смены темы: небольшой слой вместо scale(220) */
.wave{width:200px;height:200px;margin:-100px;will-change:transform,opacity;animation:wv2 1.1s cubic-bezier(.22,1,.36,1) forwards}
@keyframes wv2{from{transform:scale(.1)}to{transform:scale(12);opacity:0}}
/* списки модов */
.mod{content-visibility:auto;contain-intrinsic-size:auto 64px;animation-duration:.35s;animation-delay:calc(min(var(--i,0),8)*30ms)}
/* окно не в фокусе — все CSS-анимации на паузе */
html.idle .blob,html.idle .mode.hint,html.idle #go::after,html.idle #splash,html.idle #splash *,html.idle #splash::before{animation-play-state:paused!important}
/* подсветка вкладки: без «пружины» и растягивания, движется через transform */
#ind{left:0!important;transition:transform .3s cubic-bezier(.22,1,.36,1),width .3s cubic-bezier(.22,1,.36,1)!important;will-change:transform}
body.go #ind{animation:none}
nav .rp{display:none}
/* переключатель языка */
.lang{font:600 12px Inter,system-ui,sans-serif;letter-spacing:.03em}#start em{font-style:normal}
nav{gap:4px}nav button{padding:11px 4px;font-size:13px;min-width:0;text-overflow:ellipsis} /* 7 вкладок в одну строку */
/* серверы */
.srvadd{display:flex;gap:8px;align-items:flex-start}.srvadd .in{flex:1;min-width:0}.srvadd .btn{margin-top:10px;flex:none}
.srv{display:flex;align-items:center;gap:10px;padding:9px 10px;margin-top:8px;border:1px solid var(--line);border-radius:12px;transition:border-color .4s,opacity .3s}.srv:hover{border-color:rgba(var(--accrgb),.4)}.srv.off{opacity:.65}.srv.pend{opacity:.8}
.srv .si{width:40px;height:40px;border-radius:9px;flex:none;object-fit:cover;background:var(--off);display:grid;place-items:center;font:600 16px "Pixelify Sans",monospace;color:var(--mute)}
.srv .mi{flex:1;min-width:0}.srv .mi .t,.srv .mi .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.srv .sa{color:var(--mute);font-weight:400;font-size:12px;margin-left:6px}
.srv .ss{display:flex;align-items:center;gap:8px;flex:none;font-size:12.5px;color:var(--mute);white-space:nowrap}
.pg{padding:3px 8px;border-radius:7px;font:600 12px Inter,system-ui,sans-serif;border:1px solid currentColor}.pg.g{color:#3ddc84}.pg.y{color:#f5c542}.pg.r{color:#ff6b6b}
.ib{width:32px;height:32px;flex:none;border-radius:8px;border:1px solid var(--line);background:none;color:var(--mute);cursor:pointer;font-size:14px;transition:color .3s,border-color .3s,transform .3s}.ib:hover{color:var(--text);border-color:rgba(var(--accrgb),.5);transform:translateY(-1px)}.ib.fv{color:#f5c542;border-color:rgba(245,197,66,.5)}
/* статистика */
.tiles{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}.tile{flex:1;min-width:120px;padding:10px 12px;border:1px solid var(--line);border-radius:12px}
.tile b{display:block;font:600 20px "Pixelify Sans",monospace;color:var(--acc);white-space:nowrap}.tile span{font-size:12px;color:var(--mute)}
.sess{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 10px;margin-top:6px;border:1px solid var(--line);border-radius:10px}
.sess .mi{flex:1;min-width:0}.sess .mi .t,.sess .mi .d{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sess .dl{color:var(--text);font-size:13px;font-weight:600;white-space:nowrap}
/* 8 вкладок в одну строку, в том числе в самом узком окне */
nav{gap:3px;padding:10px 10px}nav button{flex:1 1 auto;font-size:12.5px;padding:11px 6px}
/* новости */
.news{display:flex;gap:10px;margin-top:12px;overflow-x:auto;scroll-snap-type:x proximity;padding-bottom:8px;scrollbar-width:thin;scrollbar-color:rgba(var(--accrgb),.4) transparent}
.news::-webkit-scrollbar{height:6px}.news::-webkit-scrollbar-thumb{background:rgba(var(--accrgb),.35);border-radius:9px}
.nw{flex:none;width:236px;scroll-snap-align:start;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden;cursor:pointer;transition:border-color .4s,transform .4s cubic-bezier(.22,1,.36,1);animation:up .45s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(min(var(--i,0),8)*40ms)}
.nw:hover{border-color:rgba(var(--accrgb),.5);transform:translateY(-2px)}.nw[data-nolink]{cursor:default}
.nw img,.nw .ni{display:block;flex:none;width:100%;height:100px;object-fit:cover;background:var(--off)}
.nw .nb{padding:9px 11px 11px}.nw .nd{font-size:11.5px;font-weight:600;letter-spacing:.02em;color:var(--acc)}
.nw .t{margin-top:3px;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nw .d{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.nbtns{display:flex;align-items:center;gap:6px;flex:none}
/* разбор вылетов */
nav button.alert::after{content:"";position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:#ff6b6b;box-shadow:0 0 8px #ff6b6b}
.sess.cr{align-items:flex-start}.sess.cr .mi .d{white-space:normal}
.crh{font:600 15px Inter,system-ui,sans-serif}.crh.bad{color:#ff8a8a}
.crx{margin-top:8px;padding:6px 9px;border-radius:8px;background:var(--off);font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--mute);word-break:break-word}
.crs{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
#crres .row{align-items:flex-start;margin-top:12px}

/* своя палитра и фон-фото */
#bgimg,#bgdim{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .8s}
#bgimg{background:center/cover no-repeat;transform:scale(1.08);filter:blur(var(--bgb,0px))}
#bgdim{background:var(--bg1)}
.hasbg #bgimg{opacity:1}.hasbg #bgdim{opacity:var(--bgd,.35)}
.hasbg .blob{opacity:.1!important}
:root.hasbg{--panel:color-mix(in srgb,var(--bg2) calc(var(--pa,62)*1%),transparent)}
:root.hasbg.noblur .win{background:var(--panel)}
.cpick{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px}
.cbox{display:flex;align-items:center;gap:8px;flex:1;min-width:210px;transition:opacity .4s}
.cbox label{font-size:12.5px;color:var(--mute);min-width:92px}
.auto .cb2{opacity:.4;pointer-events:none}
input[type=color]{flex:none;width:40px;height:34px;padding:0;border:1px solid var(--line);border-radius:9px;background:none;cursor:pointer}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px}input[type=color]::-webkit-color-swatch{border:0;border-radius:6px}
.in.hex{margin-top:0;width:104px;text-transform:uppercase;font-family:ui-monospace,Consolas,monospace}
.in.hex.bad{border-color:#ff6b6b}
.cprev{height:34px;margin-top:12px;border-radius:10px;background:linear-gradient(90deg in oklab,var(--acc),var(--acc2));box-shadow:0 0 18px rgba(var(--accrgb),.3);transition:box-shadow .5s}
#bgset{transition:opacity .4s}#bgset.off{opacity:.4;pointer-events:none}
#bgset .rng .d{min-width:150px}

/* ---- скины ---- */
#skin .skgrid{display:grid;grid-template-columns:190px minmax(0,1fr) 262px;gap:16px;margin-top:12px;align-items:start}
@media(max-width:940px){#skin .skgrid{grid-template-columns:190px minmax(0,1fr)}#skin .skpaint{grid-column:1/-1}}
.skctl .rng .d{min-width:92px}.skh{margin-top:12px}.skh:first-child{margin-top:0}.skh select{width:auto;margin:0;padding:5px 8px}
.skchips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.skchips .chip{user-select:none}
#sk3d{position:relative;height:200px;margin-top:8px;perspective:760px;cursor:grab;touch-action:none;border-radius:12px;background:radial-gradient(circle at 50% 78%,rgba(var(--accrgb),.2),transparent 62%)}#sk3d:active{cursor:grabbing}
.skroot{position:absolute;left:50%;top:22px;width:0;height:0;transform-style:preserve-3d;transform-origin:0 80px}
.skbox{position:absolute;transform-style:preserve-3d}
.skf{position:absolute;left:50%;top:50%;image-rendering:pixelated;backface-visibility:hidden}
.skcvw{position:relative;width:256px;height:256px;margin-top:10px;border-radius:8px;border:1px solid var(--line);background:repeating-conic-gradient(rgba(128,128,128,.28) 0 25%,rgba(128,128,128,.12) 0 50%) 0 0/16px 16px;overflow:hidden}
#skcv,#skgrid{position:absolute;inset:0;width:256px;height:256px;image-rendering:pixelated;cursor:crosshair;touch-action:none}#skgrid{pointer-events:none;display:none}#skgrid.on{display:block}
#skcol{width:40px;height:26px;padding:0;border:1px solid var(--line);border-radius:7px;background:none;cursor:pointer}
.sklib{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.skc{padding:10px;border:1px solid var(--line);border-radius:12px;transition:border-color .4s,background .4s;animation:up .6s cubic-bezier(.22,1,.36,1) backwards;animation-delay:calc(var(--i,0)*35ms)}.skc:hover{border-color:rgba(var(--accrgb),.45)}.skc.on{border-color:rgba(var(--accrgb),.75);background:rgba(var(--accrgb),.1)}
.skth{position:relative;width:48px;height:48px;border-radius:8px;overflow:hidden;background:rgba(128,128,128,.18);flex:none}
.skth i{position:absolute;inset:0;background-size:384px 384px;image-rendering:pixelated;background-repeat:no-repeat}
.skc .nm{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.skc .btns{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.skc .btns .btn{padding:4px 9px;font-size:12px}

/* ===== PERF 1.6: режим для слабых устройств (html.lite) ===== */
html.lite .blob{animation:none!important;will-change:auto}
html.lite .win{box-shadow:0 8px 24px rgba(0,0,0,.3)!important;backdrop-filter:none!important;-webkit-backdrop-filter:none!important}
html.lite .win,html.lite .tab.on>.card,html.lite .mod,html.lite .toast{animation:none!important}
html.lite .card::before{display:none}
html.lite .card,html.lite .mod,html.lite .btn,html.lite .chip,html.lite nav button{transition:border-color .2s,background .2s,color .2s,opacity .2s!important}
html.lite .card:hover,html.lite .mod:hover{transform:none}
html.lite .card.pop{animation:none}
html.lite .mode.hint,html.lite #go::after{animation:none!important}
html.lite #go::after{display:none}
html.lite .wave{display:none}
html.lite *{scroll-behavior:auto!important}

/* ===== как в обычном приложении: ничего не выделяется и не перетаскивается, кроме полей ввода ===== */
html,body{-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;cursor:default}
img,svg,canvas,a{-webkit-user-drag:none;user-drag:none}
input,textarea,select,pre,code,[contenteditable="true"]{-webkit-user-select:text;user-select:text}
input[type=range],input[type=color],input[type=checkbox],select{-webkit-user-select:none;user-select:none}
button,.btn,.chip,.sw,nav,header,label{cursor:pointer}header,nav{cursor:default}
input:not([type]),input[type=text],input[type=search],textarea{cursor:text}
html.full .app{padding:0}html.full .win{width:100%!important;height:100%!important;max-width:none;border-radius:0;border-width:0}html.full .win::before{display:none}
</style>
</head>

<div class="srvadd"><input class="in" id="sknick" maxlength="16" spellcheck="false" data-i-ph="sk.nick"><button class="btn g" id="skget" data-i="sk.get"></button></div></div>
<div class="card wide" id="skedit"><div class="skgrid">
<div class="skview"><div class="d" data-i="sk.prev"></div><div id="sk3d"><div class="skroot" id="skroot"></div></div><div class="row"><span class="d" data-i="sk.spin"></span><div class="sw on" id="skspin"></div></div></div>
<div class="skctl">

<div class="d skh" data-i="sk.layers"></div><div class="skchips" id="sklayers"><span class="chip on" data-v="hat" data-i="sk.l.hat"></span><span class="chip on" data-v="jacket" data-i="sk.l.jacket"></span><span class="chip on" data-v="sleeves" data-i="sk.l.sleeves"></span><span class="chip on" data-v="pants" data-i="sk.l.pants"></span></div>
<div class="row skh"><span class="d" data-i="sk.adj"></span><select id="skscope"><option value="all" data-i="sk.sc.all"></option><option value="head" data-i="sk.sc.head"></option><option value="body" data-i="sk.sc.body"></option><option value="arms" data-i="sk.sc.arms"></option><option value="legs" data-i="sk.sc.legs"></option></select></div>
<div class="rng"><span class="d" data-i="sk.hue"></span><input type="range" id="skhue" min="-180" max="180" step="1" value="0"><span class="val"></span></div>

</div>

// theme
const TH=[["Изумруд","#4ade80","#22d3ee"],["Аметист","#c084fc","#f472b6"],["Пламя","#fb923c","#f43f5e"],["Иней","#38bdf8","#818cf8"],["Закат","#fb7185","#fbbf24"],["Океан","#06b6d4","#3b82f6"],["Лайм","#a3e635","#22c55e"],["Роза","#f472b6","#fb7185"],["Золото","#fbbf24","#fb923c"],["Лаванда","#a78bfa","#60a5fa"],["Мята","#2dd4bf","#4ade80"],["Вишня","#f43f5e","#be185d"],["Космос","#6366f1","#a855f7"],["Неон","#22d3ee","#e879f9"],["Лава","#ef4444","#f97316"],["Лёд","#7dd3fc","#e0f2fe"],["Джунгли","#16a34a","#84cc16"],["Сумерки","#8b5cf6","#ec4899"],["Персик","#fdba74","#f9a8d4"],["Бирюза","#14b8a6","#0ea5e9"],["Рубин","#e11d48","#9333ea"],["Электро","#facc15","#22d3ee"],["Арктика","#67e8f9","#a5b4fc"],["Малина","#d946ef","#f43f5e"],["Хвоя","#059669","#38bdf8"],["Янтарь","#f59e0b","#dc2626"],["Индиго","#4f46e5","#06b6d4"],["Сакура","#f9a8d4","#c4b5fd"],["Токсик","#bef264","#22d3ee"],["Пустота","#9333ea","#3b82f6"],["Мандарин","#f97316","#eab308"],["Графит","#94a3b8","#e2e8f0"]];
const rgb=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
let tIdx=Math.min(31,+(get('mc-ti')||0)),CA=TH[tIdx][1],CB=TH[tIdx][2],TG=rgb(CA),TG2=rgb(CB),CUST=null;try{CUST=JSON.parse(get('mc-cust')||'null')}catch(e){}
function hue(h){const [r,g,b]=rgb(h).map(v=>v/255),M=Math.max(r,g,b),m=Math.min(r,g,b),d=M-m;if(!d)return 210;const x=M===r?((g-b)/d)%6:M===g?(b-r)/d+2:(r-g)/d+4;return Math.round((x*60+360)%360)}
const okHex=v=>/^#[0-9a-f]{6}$/i.test(v);
const toHex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
function hsl(h){const [r,g,b]=rgb(h).map(v=>v/255),M=Math.max(r,g,b),m=Math.min(r,g,b),l=(M+m)/2,d=M-m;return [hue(h),d?d/(1-Math.abs(2*l-1)):0,l]}
function fromHsl(h,s,l){h=((h%360)+360)%360;const k=n=>(n+h/30)%12,a=s*Math.min(l,1-l),f=n=>l-a*Math.max(-1,Math.min(k(n)-3,Math.min(9-k(n),1)));return toHex([f(0)*255,f(8)*255,f(4)*255])}
// «гармоничный» второй цвет: соседний оттенок (+40°) с той же насыщенностью и яркостью в комфортных пределах
function autoSecond(a){const [h,s,l]=hsl(a);if(s<.12)return fromHsl(h,s,l<.5?l+.25:l-.25);return fromHsl(h+40,Math.max(.55,s),Math.min(.72,Math.max(.5,l)))}
function applyBg(){
  const dk=R.dataset.mode!=='light',h1=hue(CA),h2=CUST?hue(CB):h1;

  const k1=CUST?Math.max(.12,Math.min(1,hsl(CA)[1]*1.25)):1,k2=CUST?Math.max(.12,Math.min(1,hsl(CB)[1]*1.25)):1;

  R.style.setProperty('--bg2',dk?`hsl(${h2} ${42*k2}% 11%)`:`hsl(${h2} ${35*k2}% 86%)`)
}

function waveAt(el){const w=document.createElement('div');w.className='wave';const b=el.getBoundingClientRect();w.style.left=b.left+b.width/2+'px';w.style.top=b.top+b.height/2+'px';document.body.appendChild(w);setTimeout(()=>w.remove(),1500)}

let mHits=[],mInst=[],mT,mLoaded='',mKind='mod';
const mver=()=>$('#ver').value;
const modLoader=()=>{const l=curLoader();return l==='vanilla'?'fabric':l},mkey=()=>mver()+'|'+modLoader()+'|'+mKind; // при профиле «Обычный» моды и шейдеры ищутся для Fabric
const mldr=()=>mKind==='resourcepack'?curLoader():modLoader(); // ресурспаки работают и на чистой игре

$('#ldr').addEventListener('click',()=>{mLoaded='';mHits=[]});
const fmtN=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':n;
function renderMods(){
  const ids=new Set(mInst.map(x=>x.id));
  $('#mres').innerHTML=mHits.map((h,i)=>`<div class="mod" style="--i:${i}"><img loading="lazy" decoding="async" src="${esc(h.icon||'')}" onerror="this.style.visibility='hidden'" alt=""><div class="mi"><div class="t">${esc(h.title)}</div><div class="d">${esc(h.desc)}</div></div><span class="dl">⬇ ${fmtN(h.dl)}</span><button class="btn g" data-slug="${esc(h.slug)}" ${ids.has(h.id)?'disabled':''}>${tr(ids.has(h.id)?'mod.done':'mod.get')}</button></div>`).join('')||`<div class="d" style="margin-top:10px">${tr('mod.none')}</div>`;
  $('#minst').innerHTML=mInst.map((x,i)=>`<div class="mod" style="--i:${i}"><div class="mi"><div class="t">${esc(x.title)}${x.dep?tr('mod.dep'):''}</div><div class="d">${esc(x.file)}</div></div>${x.auto?`<span class="dl">${tr('mod.auto')}</span>`:`<button class="btn g" data-rm="${esc(x.id)}">${tr('mod.rm')}</button>`}</div>`).join('')||`<div class="d" style="margin-top:10px">${tr(mKind==='mod'?'mod.empty':'mod.empty.'+mKind)}</div>`;

async function loadMods(){

  catch(e){if(k!==mKind)return;$('#mres').innerHTML='<div class="d" style="margin-top:10px">'+esc(tr('mod.loadErr',{e:String(e.message||e).replace(/^Error invoking remote method '\w+': (Error: )?/,'')}))+'</div>'}
}
$('#nav button[data-t=modt]').addEventListener('click',()=>{if(mLoaded!==mkey()||!mHits.length)loadMods();else mLabels()});

// ---- статистика ----
const fmtDur=s=>{const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?tr('stat.hm',{h,m}):m?tr('stat.m',{m}):tr('stat.lt')};
function renderStats(){
  if(!stat||!stat.sessions)return;
  $('#stat-tiles').innerHTML=[[fmtDur(stat.totalSec),'stat.total'],[fmtDur(stat.weekSec),'stat.week'],[stat.count,'stat.count']].map(([v,k])=>`<div class="tile"><b>${esc(v)}</b><span>${tr(k)}</span></div>`).join('');
  const loc=LANG==='ru'?'ru-RU':'en-US';
  $('#stat-list').innerHTML=stat.sessions.map(x=>`<div class="sess"><div class="mi"><div class="t">${esc(new Date(x.t).toLocaleString(loc,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))}</div><div class="d">Minecraft ${esc(x.v)} · ${esc(x.a)}${x.s?' · '+esc(x.s):''}</div></div><span class="dl">${esc(fmtDur(x.d))}</span></div>`).join('')||`<div class="d" style="margin-top:10px">${tr('stat.empty')}</div>`;
}
api.onStats(s=>{stat=s;renderStats()});

// ---- серверы ----
let srvs=[],sst={},sFil='all',sAt=0,sTok=0,sLoaded=false;
const pingCls=p=>p<80?'g':p<200?'y':'r';
function srvStatus(st){
  if(st.ok===true)return `<span title="${esc((st.version?st.version+(st.sample.length?' · ':''):'')+st.sample.join(', '))}">👥 ${st.online}/${st.max}</span><span class="pg ${pingCls(st.ping)}">${tr('srv.ms',{n:st.ping})}</span>`;
  if(st.ok===false)return `<span class="pg r" title="${esc(tr('srv.e.'+(['timeout','refused','dns'].includes(st.error)?st.error:'bad')))}">${tr('srv.off')}</span>`;
  return '<span>…</span>';
}
function srvRow(s){
  const st=sst[s.id]||{},cls=(st.ok===false?' off':'')+(st.pend?' pend':'');
  const ico=st.ok&&st.icon?`<img class="si" src="${esc(st.icon)}" alt="">`:`<div class="si">${esc((s.name[0]||'?').toUpperCase())}</div>`;
  return `<div class="srv${cls}" data-sid="${esc(s.id)}">${ico}<div class="mi"><div class="t">${esc(s.name)}<span class="sa">${esc(s.addr)}</span></div><div class="d">${esc(st.ok&&st.motd?st.motd:s.addr)}</div></div><div class="ss">${srvStatus(st)}</div><button class="ib${s.fav?' fv':''}" data-fav title="${tr(s.fav?'srv.unfav':'srv.fav')}">${s.fav?'★':'☆'}</button><button class="ib" data-join title="${tr('srv.join')}">▶</button><button class="ib" data-sdel title="${tr('srv.del')}">✕</button></div>`;
}
function renderSrv(){
  const l=srvs.filter(s=>sFil==='all'||s.fav).sort((a,b)=>b.fav-a.fav);
  $('#slist').innerHTML=l.map(srvRow).join('')||`<div class="d" style="margin-top:10px">${tr(srvs.length?'srv.emptyFav':'srv.empty')}</div>`;
}
function paintSrv(id){ // обновляем одну строку, не перерисовывая список
  const s=srvs.find(x=>x.id===id),row=$('#slist').querySelector(`[data-sid="${id}"]`);
  if(s&&row)row.outerHTML=srvRow(s);
}
async function pingSrv(s){
  const tok=++sTok,cur=sst[s.id]=sst[s.id]||{};cur.tok=tok;cur.pend=true;paintSrv(s.id);
  let r;try{r=await api.srvPing(s.addr)}catch{r={ok:false,error:'bad'}}
  if(!sst[s.id]||sst[s.id].tok!==tok)return; // сервер удалён или опрошен заново — результат устарел
  sst[s.id]={tok,pend:false,...r};paintSrv(s.id);
}
const pingAll=()=>{sAt=Date.now();srvs.forEach(pingSrv)};
async function loadSrv(){srvs=(await safe(()=>api.srvList()))||[];sLoaded=true;renderSrv();pingAll()}
$('#nav button[data-t=srvt]').addEventListener('click',()=>{if(!sLoaded)loadSrv();else if(Date.now()-sAt>15000)pingAll()});
$('#srefresh').onclick=()=>{ripple($('#srefresh'));sfxPlay('chip');if(sLoaded)pingAll();else loadSrv()};
setInterval(()=>{if(sLoaded&&$('#srvt').classList.contains('on')&&!document.hidden)pingAll()},30000);
const addSrv=()=>safe(async()=>{
  const a=$('#saddr').value.trim();if(!a)return;
  srvs=await api.srvAdd($('#sname').value,a);$('#saddr').value='';$('#sname').value='';sfxPlay('on');
  sFil='all';$$('#sfilter .chip').forEach(c=>c.classList.toggle('on',c.dataset.v==='all'));
  renderSrv();pingSrv(srvs[srvs.length-1]);
});
$('#sadd').onclick=addSrv;
$('#saddr').addEventListener('keydown',e=>{if(e.key==='Enter')addSrv()});
$('#sfilter').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c){sFil=c.dataset.v;renderSrv()}});
function joinSrv(s){if(busy)return;toast(tr('srv.joining',{name:s.name}));$('#nav button[data-t=play]').click();play(s.addr)}
$('#slist').onclick=e=>{
  const row=e.target.closest('.srv');if(!row)return;
  const id=row.dataset.sid,s=srvs.find(x=>x.id===id);if(!s)return;
  if(e.target.closest('[data-fav]'))safe(async()=>{srvs=await api.srvFav(id);sfxPlay('chip');renderSrv()});
  else if(e.target.closest('[data-sdel]'))safe(async()=>{srvs=await api.srvDel(id);delete sst[id];sfxPlay('off');renderSrv()});
  else if(e.target.closest('[data-join]'))joinSrv(s);
};

let nws=[],nStale=false,nState='load';
function renderNews(){
  const box=$('#nlist');
  if(!nws.length){box.innerHTML=`<div class="d" style="margin-top:4px">${tr(nState==='load'?'news.loading':nState==='err'?'news.err':'news.empty')}</div>`;$('#nstat').textContent='';return}
  const loc=LANG==='ru'?'ru-RU':'en-US';
  box.innerHTML=nws.map((n,i)=>{
    const dt=new Date(n.date),ds=isNaN(dt)?esc(n.date):esc(dt.toLocaleDateString(loc,{day:'numeric',month:'long',year:'numeric'}));
    return `<div class="nw" ${n.url?`data-url="${esc(n.url)}"`:'data-nolink'} style="--i:${i}">${n.img?`<img loading="lazy" decoding="async" src="${esc(n.img)}" onerror="this.style.visibility='hidden'" alt="">`:'<div class="ni"></div>'}<div class="nb"><div class="nd">${ds}</div><div class="t">${esc(n.title)}</div><div class="d">${esc(n.text)}</div></div></div>`}).join('');
  $('#nstat').textContent=nStale?tr('news.stale'):'';

async function loadNews(force){
  const b=$('#nrefresh');b.disabled=true;
  if(!nws.length){nState='load';renderNews()}
  try{const r=await api.news(!!force);nws=r.items||[];nStale=!!r.stale;nState=r.ok?'ok':'err'}catch{nState='err'}
  b.disabled=false;renderNews();
}
$('#nrefresh').onclick=()=>{ripple($('#nrefresh'));sfxPlay('chip');loadNews(true)};
$('#nlist').onclick=e=>{const c=e.target.closest('.nw');if(c&&c.dataset.url){openExt(c.dataset.url);sfxPlay('chip')}};
const nScroll=k=>{const l=$('#nlist');l.scrollBy({left:k*l.clientWidth*.8,behavior:'smooth'});sfxPlay('chip')};
$('#nprev').onclick=()=>nScroll(-1);$('#nnext').onclick=()=>nScroll(1);
setInterval(()=>{if(!document.hidden)loadNews()},30*60*1000);

// ---- разбор вылетов ----
let crL=[],crR=null,crDone=new Set();
const crT=(id,part,dv,p)=>{const k='cr.f.'+id+'.'+part+dv,s=tr(k,p);return s===k?tr('cr.f.'+id+'.'+part,p):s}; // вариант текста (dv) или основной
const crVerdict=r=>{const v=r.verdict||{g:'none',names:[]};return tr('cr.v.'+(v.g==='mod'&&v.names.length>1?'mods':v.g),{name:v.names[0]||'',names:v.names.join(', ')})};
function syncSettings(){const st=S.settings;$('#java').value=st.java||'';$('#ram').value=st.ram;$('#ram').dispatchEvent(new Event('input'));fmtRam();$$('#flags .chip').forEach(c=>c.classList.toggle('on',c.dataset.v===st.flags));setLdr(st.loader)}
function renderCr(){
  $('#crcard').style.display=(crR||crL.length)?'':'none';
  $('#crl').innerHTML=crL.slice(0,5).map((x,i)=>`<div class="sess"><div class="mi"><div class="t">${esc(x.name)} <span class="key">${tr('cr.kind.'+x.kind)}</span></div><div class="d">${esc(fmtDT(x.t))} · ${esc(bkInst(x.inst))}</div></div><button class="btn g" data-cr="${i}">${tr('cr.an')}</button></div>`).join('');
  if(!crR){$('#crres').innerHTML='';return}
  const r=crR,btn=(fi,ai,a)=>{const d=crDone.has(fi+':'+a.a+':'+(a.arg||''));return `<button class="btn g" data-fi="${fi}" data-ai="${ai}"${d?' disabled':''}>${d?'✓ ':''}${esc(tr('cr.a.'+a.a,a.p||{}))}</button>`};
  const meta=[r.id?r.name:tr('cr.src.out'),r.mc&&'Minecraft '+r.mc,r.java&&'Java '+r.java].filter(Boolean).map(esc).join(' · ');
  $('#crres').innerHTML=`<div class="row"><div><div class="crh${r.verdict.g==='none'?'':' bad'}">${esc(crVerdict(r))}</div><div class="d">${meta}</div></div>${r.id?`<button class="btn g" id="crshow">${tr('cr.open')}</button>`:''}</div>`
    +(r.exc?`<div class="crx">${esc(r.exc)}</div>`:'')
    +(r.suspects.length?`<div class="crs">${r.suspects.slice(0,5).map(s=>`<span class="key" title="${esc(tr('cr.conf.'+s.conf))}"${s.conf==='low'?' style="opacity:.65"':''}>${esc(s.name)}${s.ver?' '+esc(s.ver):''} · ${esc(tr('cr.why.'+s.why))}</span>`).join('')}</div>`:'')
    +(r.acts.length?`<div class="chips">${r.acts.map((a,j)=>btn(-1,j,a)).join('')}</div>`:'')
    +r.findings.map((f,i)=>`<div class="sess cr"><div class="mi"><div class="t">${esc(crT(f.id,'t',f.dv,f.p))}</div><div class="d">${esc(crT(f.id,'d',f.dv,f.p))}</div></div><div class="nbtns">${f.acts.map((a,j)=>btn(i,j,a)).join('')}</div></div>`).join('');
}
const loadCr=()=>safe(async()=>{crL=await api.crList();renderCr()});

// --- цвет ---
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let h=0,s=0;if(mx!==mn){const d=mx-mn;s=l>.5?d/(2-mx-mn):d/(mx+mn);h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;h*=60}return[h,s,l]}
function hsl2rgb(h,s,l){h=((h%360)+360)%360/360;if(!s){const v=Math.round(l*255);return[v,v,v]}const q=l<.5?l*(1+s):l+s-l*s,p=2*l-q,f=t=>{t=(t+1)%1;return t<1/6?p+(q-p)*6*t:t<.5?q:t<2/3?p+(q-p)*(2/3-t)*6:p};return[f(h+1/3),f(h),f(h-1/3)].map(v=>Math.round(v*255))}
function skMask(scope){const m=new Uint8Array(4096);for(const[x,y,w,h]of SKS[scope])for(let j=y;j<y+h;j++)for(let i=x;i<x+w;i++)m[j*64+i]=1;return m}
function skCompute(){
  const w=skClone(K.base),a=K.adj;
  if(a.h||a.s||a.l){const m=skMask($('#skscope').value),d=w.data;
    for(let i=0;i<4096;i++){if(!m[i]||!d[i*4+3])continue;let[h,s,l]=rgb2hsl(d[i*4],d[i*4+1],d[i*4+2]);
      h+=a.h;s=Math.max(0,Math.min(1,s*(1+a.s/100)));l=a.l>=0?l+(1-l)*a.l/100:l*(1+a.l/100);
      const c=hsl2rgb(h,s,l);d[i*4]=c[0];d[i*4+1]=c[1];d[i*4+2]=c[2]}}

}
// --- итоговая текстура ---
function skFinal(){skCtx.putImageData(K.work,0,0);for(const k in SKL)if(!K.layers[k])for(const[x,y,w,h]of SKL[k])skCtx.clearRect(x,y,w,h);return K.fc}
let skQ=false;

function skBuild(){

  const part=(key,uvb,cx,cy,w,over)=>{const[u,v,,h,d]=uvb,uvw=w||uvb[2],inf=over?1:0,W=uvw+inf,H=h+inf,D=d+inf;
    const b=document.createElement('div');b.className='skbox';b.style.cssText=`width:${W*SKU}px;height:${H*SKU}px;left:${(cx-W/2)*SKU}px;top:${(cy-H/2)*SKU}px`;
    const F=[[u+d,v+d,uvw,h,W,H,`translateZ(${D*SKU/2}px)`],[u+2*d+uvw,v+d,uvw,h,W,H,`rotateY(180deg) translateZ(${D*SKU/2}px)`],
      [u,v+d,d,h,D,H,`rotateY(-90deg) translateZ(${W*SKU/2}px)`],[u+d+uvw,v+d,d,h,D,H,`rotateY(90deg) translateZ(${W*SKU/2}px)`],
      [u+d,v,uvw,d,W,D,`rotateX(90deg) translateZ(${H*SKU/2}px)`],[u+d+uvw,v,uvw,d,W,D,`rotateX(-90deg) translateZ(${H*SKU/2}px)`]];
    for(const[sx,sy,sw,sh,fw,fh,tr]of F){const c=document.createElement('canvas');c.width=sw;c.height=sh;c.className='skf';
      c.style.cssText=`width:${fw*SKU}px;height:${fh*SKU}px;margin:${-fh*SKU/2}px 0 0 ${-fw*SKU/2}px;transform:${tr}`;b.appendChild(c);K.faces.push({c,x:c.getContext('2d'),sx,sy,sw,sh})}
    root.appendChild(b)};
  for(const o of[0,1]){ // 0 — основной слой, 1 — внешний (чуть больше)
    part(o?'hat':'head',SKF[o?'hat':'head'],0,4,0,o);
    part(o?'jacket':'body',SKF[o?'jacket':'body'],0,14,0,o);
    part(o?'rsl':'rarm',SKF[o?'rsl':'rarm'],-(4+aw/2),14,aw,o);

}

const skSetR=(r,v)=>{r.value=v;r.style.setProperty('--v',(r.value-r.min)/(r.max-r.min)*100+'%');r.nextElementSibling.textContent=r.value};

const skHex=(r,g,b)=>'#'+[r,g,b].map(v=>v.toString(16).padStart(2,'0')).join('');

function skLine(x0,y0,x1,y1){const dx=Math.abs(x1-x0),dy=-Math.abs(y1-y0),sx=x0<x1?1:-1,sy=y0<y1?1:-1;let e=dx+dy;for(;;){skPaintAt(x0,y0);if(x0===x1&&y0===y1)break;const e2=2*e;if(e2>=dy){e+=dy;x0+=sx}if(e2<=dx){e+=dx;y0+=sy}}}

(function(){let dn=false,lx=0,ly=0;

function skLib(){
  const act=K.sel[S&&S.active];
  $('#sklib').innerHTML=K.lib.map((x,i)=>`<div class="skc ${x.id===act?'on':''}" style="--i:${i}"><div class="row" style="justify-content:flex-start"><div class="skth"><i style="background-image:url(${x.data});background-position:-48px -48px"></i><i style="background-image:url(${x.data});background-position:-240px -48px"></i></div><div style="min-width:0"><div class="nm" title="${esc(x.name)}">${esc(x.name)}</div><div class="d">${x.id===act?tr('sk.on'):tr(x.model==='slim'?'sk.slim':'sk.classic').split(' ')[0]}</div></div></div><div class="btns"><button class="btn g" data-sk="use" data-id="${x.id}">${tr('sk.use')}</button><button class="btn g" data-sk="edit" data-id="${x.id}">${tr('sk.edit')}</button><button class="btn g" data-sk="exp" data-id="${x.id}">${tr('sk.export')}</button><button class="btn g" data-sk="del" data-id="${x.id}">${tr('sk.del')}</button></div></div>`).join('')||`<div class="d">${tr('sk.lib.empty')}</div>`}
$('#sklib').onclick=e=>{const b=e.target.closest('[data-sk]');if(!b)return;const x=K.lib.find(y=>y.id===b.dataset.id);if(!x)return;sfxPlay('chip');
  skGo(async()=>{
    if(b.dataset.sk==='use')await skUse(x.id);
    else if(b.dataset.sk==='edit'){if(!skConfirm())return;await skLoad(x.data,{id:x.id,name:x.name,model:x.model});$('main').scrollTo({top:0,behavior:'smooth'})}
    else if(b.dataset.sk==='exp')await api.skExport(x.id);
    else if(b.dataset.sk==='del'){if(!confirm(tr('sk.del.q',{n:x.name})))return;const r=await api.skDel(x.id);K.lib=r.lib;K.sel=r.sel;if(K.id===x.id)K.id=null;skLib()}})};
// --- плащи (только Microsoft) ---
async function skCapes(){
  const a=skAccount(),box=$('#skcapes'),d=$('#skcaped');
  if(!a||a.type!=='microsoft'){K.capeFor=null;d.textContent=tr('sk.cape.off');box.innerHTML='';return}
  d.textContent=tr('sk.cape.d');if(K.capeFor===a.id&&box.children.length&&!skCapes.force)return;skCapes.force=false;
  try{const p=await api.skProfile();K.capeFor=a.id;const none=!p.capes.some(c=>c.active);
    box.innerHTML=`<span class="chip ${none?'on':''}" data-c="">${tr('sk.cape.none')}</span>`+p.capes.map(c=>`<span class="chip ${c.active?'on':''}" data-c="${esc(c.id)}">${esc(c.alias||'Cape')}</span>`).join('');
    if(!p.capes.length)d.textContent=tr('sk.cape.empty')}
  catch(e){box.innerHTML='';d.textContent=String(e.message||e).replace(/^Error invoking remote method '\w+': (Error: )?/,'')}}
$('#skcapes').addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;ripple(c);sfxPlay('chip');
  skGo(async()=>{await api.skCape(c.dataset.c||null);$$('#skcapes .chip').forEach(x=>x.classList.toggle('on',x===c))},'sk.ok.cape')});
// --- вход на вкладку / смена аккаунта / языка ---
function skAcc(){const a=skAccount();$('#skacc').textContent=a?tr('sk.acc',{name:a.name,type:a.type==='microsoft'?tr('acc.type.ms'):tr('acc.type.off')}):'';if(K.loaded){skLib();skCapes()}}
function skLang(){skAcc()}
async function skOpen(){
  if(!K.loaded){K.loaded=true;try{const r=await api.skState();K.lib=r.lib;K.sel=r.sel}catch(e){}skTemplate()}
  skAcc();skLib();skCapes()}
$('#nav [data-t="skin"]').addEventListener('click',()=>skOpen());
function applyLang(){
  R.lang=LANG;
  $$('[data-i]').forEach(e=>e.textContent=tr(e.dataset.i));
  $$('[data-i-ph]').forEach(e=>e.placeholder=tr(e.dataset.iPh));
  $$('[data-i-title]').forEach(e=>e.title=tr(e.dataset.iTitle));
  $$('.lang').forEach(b=>b.textContent=LANG.toUpperCase());
  $$('.th').forEach((x,i)=>x.title=tn(i));$('#tname').textContent=CUST?tr('th.my.name'):tn(tIdx);
  if(lgK)$('#lg').textContent=tr(lgK);if(vstK)$('#vst').textContent=tr(vstK);
  if(aboutV)$('#aver').textContent=tr('ab.ver',{v:aboutV});
  if(S){renderAcc();skLang();fmtRam();renderRuns();mLabels();if(mLoaded)renderMods();if(sLoaded)renderSrv();renderStats()}
  else{$('#cname').textContent=tr('play.noacc');$('#ctype').textContent=tr('play.noacc.d')}
  renderNews();renderBk();renderCr();place($('#nav .on'));set('mc-lang',LANG)
}
function setLang(l){if(l===LANG)return;LANG=l;applyLang();api.save({lang:l});sfxPlay('tab')}
$('#lang').onclick=$('#lang2').onclick=()=>setLang(I18N.LANGS[(I18N.LANGS.indexOf(LANG)+1)%I18N.LANGS.length]);
applyLang();
loadNews();
</script>
</body>
